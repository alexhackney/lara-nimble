name: Release

# Releases are cut on merge to main from the first versioned CHANGELOG heading.
# If that version has no tag yet, tests run, then the tag and GitHub release are
# created. Merges that don't add a new heading (e.g. Dependabot) release nothing.
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from CHANGELOG
        id: version
        run: |
          VERSION=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)
          if [ -z "$VERSION" ]; then
            echo "No versioned heading found in CHANGELOG.md; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "v${VERSION} is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v${VERSION}."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.version.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        if: steps.version.outputs.release == 'true'
        run: vendor/bin/phpunit

      - name: Run PHPStan
        if: steps.version.outputs.release == 'true'
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run Pint
        if: steps.version.outputs.release == 'true'
        run: vendor/bin/pint --test

      - name: Extract changelog for this version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > changelog_extract.md

      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Release v${VERSION}" \
            --notes-file changelog_extract.md \
            --generate-notes
